; OPR Telemetry - valores por defecto.
; Se editan desde Content Manager (Settings > Assetto Corsa > Python app settings > OPR Telemetry).
; No edites este archivo: lo que cambies (sobre todo el token) se guarda en config.ini, que la app
; lee encima de este y que las actualizaciones de la app no pisan.
; Los nombres de seccion llevan espacio (no ":") porque Content Manager ignora el archivo si no.
; Hay dos destinos: "graficas" (OPR) y "extra" (apagado hasta que le pongas una URL).

[backend graficas]
; Destino: telemetria OPR
url = https://oppenpaddockracing.site ; URL del backend (solo la direccion base, sin /api/telemetry/ingest)
token = ; Tu token (generalo en la pagina principal del backend; uno por piloto)
server = * ; Servidores que envian aca (IP, IP:puerto_http o parte del nombre del servidor, separados por coma; * = cualquiera)

[backend extra]
; Destino adicional (opcional)
url = ; URL de otro backend (vacio = destino apagado)
token = ; Token de ese backend
server = ; Servidores que envian aca (IP, IP:puerto_http o parte del nombre, separados por coma; * = cualquiera)

[telemetry]
; Envio
send_interval_ms = 120 ; Intervalo de envio (cada cuantos ms se manda un paquete); from 50 ms to 1000 ms
timeout_seconds = 2.0 ; Timeout de cada envio; from 1 s to 10 s
debug = 0 ; Modo debug (escribe en py_log.txt el resultado de cada envio, nunca el token); 1 or 0
